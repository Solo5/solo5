name: DragonFly amd64
on:
  push:
    branches:
      - main
  pull_request:

# Restrict the GITHUB_TOKEN
permissions: {}

jobs:
  Build:
    name: DragonFly amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: DragonFly action
        id: test
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake git llvm18 gcc9 sudo bash
          run: |
            git config --global --add safe.directory /home/runner/work/solo5/solo5
            set -x
            env HOST_CC=clang18 TARGET_LD=ld.lld18 TARGET_CC=clang18 ./configure.sh
            gmake
            cd tests
            sudo ./setup-tests.sh
            sudo ./run-tests.sh
            cd ..
            gmake clean
            env HOST_CC=gcc9 TARGET_CC=gcc9 ./configure.sh
            gmake
            cd tests
            sudo ./setup-tests.sh
            sudo ./run-tests.sh
