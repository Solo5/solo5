name: FreeBSD amd64
on:
  push:
    branches:
      - main
  pull_request:

# Restrict the GITHUB_TOKEN
permissions: {}

jobs:
  Build:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: FreeBSD action
        id: test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y pkgconf gmake git sudo bash
          run: |
            git config --global --add safe.directory /home/runner/work/solo5/solo5
            set -x
            ./configure.sh
            gmake
            cd tests
            sudo ./setup-tests.sh
            sudo ./run-tests.sh
