name: OpenBSD amd64
on:
  push:
    branches:
      - main
  pull_request:

# Restrict the GITHUB_TOKEN
permissions: {}

jobs:
  Build:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: OpenBSD action
        id: test
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add gmake git bash sudo-1.9.17.2p1
          # ^ Unfortunately, pkg_add fails to install just `sudo` as multiple
          # variants are available
          run: |
            git config --global --add safe.directory /home/runner/work/solo5/solo5
            set -x
            ./configure.sh
            gmake
            cd tests
            sudo ./setup-tests.sh
            sudo ./run-tests.sh
